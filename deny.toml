# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # rsa via surrealdb/jsonwebtoken — no fixed version available
    "RUSTSEC-2023-0071",
    # unmaintained crates from transitive deps (surrealdb, utoipa-axum)
    "RUSTSEC-2026-0258",
    "RUSTSEC-2025-0141", # bincode via surrealdb-core
    "RUSTSEC-2024-0436", # paste via utoipa-axum / rmcp
    # The mongodb 3.8 / surrealdb 3.2 / rand 0.10 bump cleared these, so they are
    # no longer ignored: RUSTSEC-2026-0119, -0104, -0098, -0099, -0118, -0097,
    # RUSTSEC-2025-0047, RUSTSEC-2025-0134, RUSTSEC-2023-0089.
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "LicenseRef-Proprietary",
    "MPL-2.0",
    "Unlicense",
    # SurrealDB uses BUSL-1.1 (converts to Apache-2.0 after 4 years)
    "BUSL-1.1",
]
# surrealdb packages don't include license field in their manifests
exceptions = [
    { allow = ["BUSL-1.1"], name = "surrealdb" },
    { allow = ["BUSL-1.1"], name = "surrealdb-core" },
    { allow = ["BUSL-1.1"], name = "surrealdb-types" },
    { allow = ["BUSL-1.1"], name = "surrealdb-types-derive" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
